name: SDK quality (non-blocking)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sdk-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: MCP conformance smoke tests (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Stage isolated quality fixtures
        run: |
          mkdir -p src/conformance
          cp -R tests/sdk-quality/fixtures/. src/conformance/

      - name: Compile MoonBit native release fixtures
        run: moon build --target native --release --output-json

      - name: Run MCP conformance smoke suite
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/conformance

          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then
              echo "Stopping conformance server process group $server_pid"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              sleep 0.2
              kill -KILL -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # Reap moonrun/native descendants with the launcher.
          setsid moon run --target native --release src/conformance/server \
            > artifacts/conformance/server.log 2>&1 &
          server_pid=$!

          ready=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            status=$(curl --max-time 1 -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:3000/mcp || true)
            if [ "$status" != "000" ]; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            cat artifacts/conformance/server.log
            echo "Conformance fixture did not start."
            exit 1
          fi

          overall=0
          log=artifacts/conformance/results.log
          case_number=0
          run_case() {
            label="$1"
            seconds="$2"
            shift 2
            case_number=$((case_number + 1))
            case_log="artifacts/conformance/case-\${case_number}.log"
            echo "=== $label (limit: \${seconds}s) ===" | tee -a "$log"

            # Isolate the entire npx/Node process tree so timeout cleanup does
            # not leave children holding pipes open.
            setsid "$@" > "$case_log" 2>&1 &
            command_pid=$!
            sleep "$seconds" &
            timer_pid=$!
            status=0
            finished=""
            wait -n -p finished "$command_pid" "$timer_pid" || status=$?

            if [ "$finished" = "$timer_pid" ]; then
              echo "TIMEOUT: $label exceeded \${seconds}s" >> "$case_log"
              kill -TERM -- "-$command_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$command_pid" 2>/dev/null || true
              wait "$command_pid" 2>/dev/null || true
              status=124
            else
              kill "$timer_pid" 2>/dev/null || true
              wait "$timer_pid" 2>/dev/null || true
            fi

            kill -TERM -- "-$command_pid" 2>/dev/null || true
            sleep 0.1
            kill -KILL -- "-$command_pid" 2>/dev/null || true
            cat "$case_log" | tee -a "$log"

            if [ "$status" -eq 0 ]; then
              echo "RESULT: PASS ($label)" | tee -a "$log"
            else
              echo "RESULT: FAIL ($label, exit $status)" | tee -a "$log"
              overall=1
            fi
          }

          run_case "server / stateless lifecycle" 45 \
            npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 \
            server --url http://127.0.0.1:3000/mcp --scenario server-stateless --timeout 10000 --verbose

          run_case "server / tools list" 45 \
            npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 \
            server --url http://127.0.0.1:3000/mcp --scenario tools-list --timeout 10000 --verbose

          run_case "server / simple text tool call" 45 \
            npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 \
            server --url http://127.0.0.1:3000/mcp --scenario tools-call-simple-text --timeout 10000 --verbose

          run_case "client / tools_call" 45 \
            npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 \
            client --command "moon run --target native --release src/conformance/client" \
            --scenario tools_call --timeout 10000 --verbose

          run_case "client / request metadata" 45 \
            npx --yes @modelcontextprotocol/conformance@0.2.0-alpha.12 \
            client --command "moon run --target native --release src/conformance/client" \
            --scenario request-metadata --timeout 10000 --verbose

          exit "$overall"

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-conformance
          path: |
            artifacts/conformance/**
            results/**
          if-no-files-found: ignore
          retention-days: 30

  throughput:
    name: MCP client and server throughput (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Install MCP Inspector load generator
        run: npm install --global @modelcontextprotocol/inspector@2.15.0

      - name: Stage isolated quality fixtures
        run: |
          mkdir -p src/conformance
          cp -R tests/sdk-quality/fixtures/. src/conformance/

      - name: Compile MoonBit native release fixtures
        run: moon build --target native --release --output-json

      - name: Benchmark MoonBit client and server
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/throughput

          {
            echo "=== Runner ==="
            uname -a
            lscpu
            free -h
            echo
            echo "=== Toolchains ==="
            moon version --all
            node --version
            npm --version
            npm list --global @modelcontextprotocol/inspector
          } > artifacts/throughput/environment.txt 2>&1

          server_pid=""
          cleanup() {
            echo "Stopping MCP Inspector daemon"
            mcpdo daemon stop >/dev/null 2>&1 || true
            if [ -n "$server_pid" ]; then
              echo "Stopping throughput server process group $server_pid"
              kill -TERM -- "-$server_pid" 2>/dev/null || true
              sleep 0.2
              kill -KILL -- "-$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          setsid moon run --target native --release src/conformance/server \
            > artifacts/throughput/server.log 2>&1 &
          server_pid=$!

          ready=0
          for attempt in $(seq 1 120); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            status=$(curl --max-time 1 -sS -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:3000/mcp || true)
            if [ "$status" != "000" ]; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            cat artifacts/throughput/server.log
            echo "Throughput fixture did not start."
            exit 1
          fi

          run_bounded() {
            label="$1"
            seconds="$2"
            output="$3"
            shift 3
            echo "=== $label (limit: ${seconds}s) ==="
            setsid "$@" > "$output" 2>&1 &
            command_pid=$!
            sleep "$seconds" &
            timer_pid=$!
            status=0
            finished=""
            wait -n -p finished "$command_pid" "$timer_pid" || status=$?

            if [ "$finished" = "$timer_pid" ]; then
              echo "TIMEOUT: $label exceeded ${seconds}s" >> "$output"
              kill -TERM -- "-$command_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$command_pid" 2>/dev/null || true
              wait "$command_pid" 2>/dev/null || true
              status=124
            else
              kill "$timer_pid" 2>/dev/null || true
              wait "$timer_pid" 2>/dev/null || true
            fi

            kill -TERM -- "-$command_pid" 2>/dev/null || true
            sleep 0.1
            kill -KILL -- "-$command_pid" 2>/dev/null || true
            cat "$output"
            return "$status"
          }
          run_bounded "MoonBit MCPClient -> MCPServer" 120 \
            artifacts/throughput/moonbit-client.log \
            moon run --target native --release src/conformance/client_benchmark
          client_status=$?
          grep -E '^\{"concurrency"' artifacts/throughput/moonbit-client.log \
            > artifacts/throughput/moonbit-client.jsonl || true

          run_bounded "MCP Inspector connect" 20 \
            artifacts/throughput/inspector-connect.log \
            mcpdo connect http://127.0.0.1:3000/mcp --era auto
          connect_status=$?
          inspector_status=1
          if [ "$connect_status" -eq 0 ]; then
            run_bounded "MCP Inspector load" 60 \
              artifacts/throughput/inspector-server.log \
              mcpdo tools/call bench_echo message:=benchmark \
                --load --load-steps 1,4,16,64 \
                --load-step-duration 5 --load-warmup 1 --load-interval 2 \
                --format json
            inspector_status=$?
            cp artifacts/throughput/inspector-server.log \
              artifacts/throughput/inspector-server.json
          fi

          if [ "$client_status" -ne 0 ] || [ "$inspector_status" -ne 0 ]; then
            echo "One or more throughput measurements failed."
            exit 1
          fi

      - name: Publish throughput summary
        if: always()
        shell: bash
        run: |
          {
            echo "## MCP throughput"
            echo
            echo "### MoonBit MCPClient to MoonBit MCPServer"
            echo
            if [ -f artifacts/throughput/moonbit-client.jsonl ]; then
              cat artifacts/throughput/moonbit-client.jsonl
            else
              echo "No MoonBit client results were produced."
            fi
            echo
            echo "### MCP Inspector load against MoonBit MCPServer"
            echo
            if [ -f artifacts/throughput/inspector-server.json ]; then
              cat artifacts/throughput/inspector-server.json
            else
              echo "No Inspector results were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload throughput results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-throughput
          path: artifacts/throughput/**
          if-no-files-found: ignore
          retention-days: 90
