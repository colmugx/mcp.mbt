name: check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --deny-warn

      - name: moon test
        run: moon test

      - name: moon check js
        run: moon check --target js --deny-warn

      - name: moon test js
        run: moon test --target js

      # wasm is a supported server target, but `moon test --target wasm`
      # cannot run yet: the wasm test binaries fail to instantiate in the
      # runner (missing "crypto" import), so gate wasm check-only.
      - name: moon check wasm
        run: moon check --target wasm --deny-warn
