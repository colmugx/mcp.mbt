name: check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check --target native --deny-warn --output-json

      - name: moon test
        run: moon test --target native --output-json

      - name: moon check js
        run: moon check --target js --deny-warn --output-json

      # Isolate async test files first: a hanging test must be attributed to
      # a file rather than leaving the whole JS test step opaque indefinitely.
      - name: isolate JS async test files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              src/client/client_cancel_branch_wbtest.mbt|src/client/http_era_connect_e2e_wbtest.mbt|src/client/http_mrtr_rounds_e2e_wbtest.mbt|src/client/stdio_request_cancel_e2e_wbtest.mbt|src/client/legacy/http_cancellation_e2e_wbtest.mbt|src/transport/http_cancellation_e2e_test.mbt|src/transport/http_compliance_e2e_test.mbt|src/transport/http_request_id_e2e_test.mbt|src/transport/sse_flush_e2e_test.mbt|src/transport/transport_io_test.mbt)
                continue
                ;;
            esac
            echo "::group::JS async tests: $file"
            if [[ "$file" == "src/transport/stdio_client_js_e2e_wbtest.mbt" ]]; then
              moon test --target js --outline "$file"
              for index in 0 1 2 3 4; do
                echo "Running $file test index $index"
                timeout --signal=TERM --kill-after=5s 20s moon test --target js --index "$index" "$file"
              done
            else
              timeout --signal=TERM --kill-after=5s 60s moon test --target js "$file"
            fi
            echo "::endgroup::"
          done < <(grep -rl --include='*.mbt' 'async test' src | sort)

      - name: moon test js
        run: timeout --signal=TERM --kill-after=5s 600s moon test --target js --output-json

      # wasm is a supported server target, but `moon test --target wasm`
      # cannot run yet: the wasm test binaries fail to instantiate in the
      # runner (missing "crypto" import), so gate wasm check-only.
      - name: moon check wasm
        run: moon check --target wasm --deny-warn --output-json
