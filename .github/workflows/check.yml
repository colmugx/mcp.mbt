name: check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: moon version --all

      - name: moon update
        run: moon update

      - name: inspect installed core async API
        run: |
          echo "Core async HTTP interfaces:"
          find "$HOME/.moon" -path '*/async/http/pkg.generated.mbti' -print -exec sed -n '1,110p' {} \;
          echo "Core async IO interfaces:"
          find "$HOME/.moon" -path '*/async/io/pkg.generated.mbti' -print -exec grep -n 'flush_partial_data\|trait BinaryWriter\|pub .*BufferedWriter' {} \;
          echo "Core async installation:"
          moon version --all

      - name: moon check
        run: moon check --target native --deny-warn --output-json

      - name: moon test
        run: moon test --target native --output-json

      - name: moon check js
        run: moon check --target js --deny-warn --output-json

      - name: moon test js
        run: moon test --target js --output-json

      # wasm is a supported server target, but `moon test --target wasm`
      # cannot run yet: the wasm test binaries fail to instantiate in the
      # runner (missing "crypto" import), so gate wasm check-only.
      - name: moon check wasm
        run: moon check --target wasm --deny-warn --output-json
