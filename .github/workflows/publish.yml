name: Publish to mooncakes.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all
          moonrun --version

      - name: moon update
        run: moon update

      - name: moon check
        run: moon check

      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        run: moon test

      - name: publish to mooncakes.io
        run: |
          mkdir -p ~/.moon
          echo "$SECRET" > ~/.moon/credentials.json
          moon publish
          rm ~/.moon/credentials.json
        env:
          SECRET: ${{ secrets.MOONCAKES_TOKEN }}

      - name: Extract version number
        id: get_version
        run: |
          # Strips the 'v' from the front of the ref_name
          VERSION=${{ github.ref_name }}
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Published to [mooncakes.io](https://mooncakes.io)

            ```bash
            moon add colmugx/mcp@$VERSION
            ```
          generate_release_notes: true
