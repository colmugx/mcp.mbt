name: source-export

on:
  push:
    branches:
      - agent/source-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout integration sources
        run: |
          git clone https://github.com/colmugx/posoco.git posoco
          git -C posoco checkout 2c2dd09648323f83f62c8f3dc509053e644a8067
          git clone https://github.com/colmugx/posoco-extension.git posoco-extension
          git -C posoco-extension checkout fa8ca09cca1064606f78a702640180337f76bf3d
          git clone --branch agent/connect-existing-client-transport https://github.com/colmugx/mcp.mbt.git mcp-pr1
          git -C mcp-pr1 checkout 57da149fafe8055830bbd0cdb68b1a67956a3e96
      - uses: actions/upload-artifact@v4
        with:
          name: ext-mcp-integration-sources
          path: |
            posoco
            posoco-extension
            mcp-pr1
          include-hidden-files: true
