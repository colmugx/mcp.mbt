name: source-export

on:
  push:
    branches:
      - agent/source-export

permissions:
  contents: write

jobs:
  rewrite-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare clean PR tree
        run: |
          cp .github/agent/pr2.patch /tmp/pr2.patch
          git fetch origin main agent/connect-existing-client-transport
          git checkout -B agent/pr2-rewrite origin/main
          git apply /tmp/pr2.patch
          git diff --check
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify
        run: |
          moon version --all
          moon update
          moon fmt --check
          moon check --deny-warn --output-json
          moon test
          moon build --target native
      - name: Rewrite PR branch
        run: |
          git config user.name "colmugx"
          git config user.email "colmugx@qq.com"
          git add moon.mod src
          git commit -m "chore:Align async dependency"
          git push --force origin HEAD:agent/connect-existing-client-transport
